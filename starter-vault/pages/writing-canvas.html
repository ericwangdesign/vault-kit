      "md": "We decided that Claude should write each page as data rather than as HTML. The main one is that the look then lives in a single renderer, so restyling it once changes every page, and Claude can't accidentally drift off-style since it never chooses colors or spacing itself. It also means the same data could later be drawn somewhere else, like inline in a chat or in Studio. The tradeoff is that pages can only use the six shapes that exist, and anything else has to be written as plain text, and adding a new shape means writing code. We also haven't figured out yet how people reading a page could reply to it."
